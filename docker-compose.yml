version: '3.8'

services:
  reviewlens:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-1.5-flash
    volumes:
      - reviewlens-data:/app/data
    restart: unless-stopped

volumes:
  reviewlens-data:

